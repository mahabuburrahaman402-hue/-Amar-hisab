name: Build Amar Hisab APK

"on":
  workflow_dispatch:
    inputs:
      version_code:
        description: "নতুন APK-এর versionCode"
        required: true
        default: "111"
        type: string
      version_name:
        description: "নতুন APK-এর versionName"
        required: true
        default: "2.1.1"
        type: string
      publish_release:
        description: "সব পরীক্ষা সফল হলে APK Release প্রকাশ করুন"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - latest.json
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  # Keep only the newest validation for this branch/event; prevent duplicate emulator jobs.
  group: amar-hisab-v2-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  prepare-signing-key:
    name: Prepare and persist Android debug signing key
    runs-on: ubuntu-24.04
    steps:
      - name: Restore stable Android debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: amar-hisab-debug-signing-v1

      - name: Create Android debug signing key only when absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storetype JKS -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -rfc | openssl x509 -noout -fingerprint -sha256 | tee "$RUNNER_TEMP/debug-key-fingerprint.txt"
          {
            echo "### Android debug signing key"
            echo 'Persistent keystore verified.'
            echo
            echo 'SHA-256 certificate fingerprint:'
            echo '`'"$(cat "$RUNNER_TEMP/debug-key-fingerprint.txt")"'`'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and validate installable debug APK
    runs-on: ubuntu-24.04
    needs: prepare-signing-key
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent Android debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: amar-hisab-debug-signing-v1

      - name: Require restored signing key
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.signing-cache.outputs.cache-hit }}" = "true"
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK using Gradle signing only
        env:
          APP_VERSION_CODE: ${{ inputs.version_code || '111' }}
          APP_VERSION_NAME: ${{ inputs.version_name || '2.1.1' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "version_code must be a positive integer" >&2
            exit 1
          fi
          if [ -z "$APP_VERSION_NAME" ]; then
            echo "version_name must not be empty" >&2
            exit 1
          fi
          gradle --no-daemon clean assembleDebug -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME"

      - name: Validate APK package, alignment and signature
        env:
          APP_VERSION_CODE: ${{ inputs.version_code || '111' }}
          APP_VERSION_NAME: ${{ inputs.version_name || '2.1.1' }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -s "$APK"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.amarhisab' versionCode='${APP_VERSION_CODE}' versionName='${APP_VERSION_NAME}'" "$RUNNER_TEMP/apk-badging.txt"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          {
            echo "### APK validation"
            echo 'APK package/version, alignment and Gradle signature verified.'
            echo
            echo 'Package metadata:'
            echo '```'
            cat "$RUNNER_TEMP/apk-badging.txt"
            echo '```'
            echo
            echo 'SHA-256:'
            sha256sum "$APK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: Amar-Hisab-Validated-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  accounting-tests:
    name: Group 2 — Accounting, party ledger and cashboxes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run dedicated accounting unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest --tests 'com.amarhisab.AccountingMathTest.multipliesQuantityByUnitPrice' --tests 'com.amarhisab.AccountingMathTest.rejectsIncompleteOrInvalidEntryLines' --tests 'com.amarhisab.AccountingMathTest.lineTotalSafelyHandlesInvalidAndOverflowValues' --tests 'com.amarhisab.AccountingMathTest.parsesWesternBengaliAndArabicIndicAmountDigits' --tests 'com.amarhisab.AccountingMathTest.transactionAmountMustBeFiniteAndPositive' --tests 'com.amarhisab.AccountingMathTest.partyLedgerTracksDueAndPaymentsPerParty' --tests 'com.amarhisab.AccountingMathTest.nonPartyIncomeAndExpensesDoNotChangePartyBalance' --tests 'com.amarhisab.AccountingMathTest.invalidPartyPaymentDoesNotChangeBalance' --tests 'com.amarhisab.AccountingMathTest.ledgerBalanceHelpersRejectNonFiniteOverflowResults' --tests 'com.amarhisab.AccountingMathTest.outstandingNeverBecomesNegative' --tests 'com.amarhisab.AccountingMathTest.dashboardReceivableNeverShowsNegativeDue' --tests 'com.amarhisab.AccountingMathTest.dashboardShowsExcessPaymentSeparately' --tests 'com.amarhisab.AccountingMathTest.parsesOnlyValidCompleteAccountingDates' --tests 'com.amarhisab.AccountingMathTest.calculatorUsesNormalOperatorPrecedenceAndParentheses' --tests 'com.amarhisab.AccountingMathTest.calculatorSupportsPercentDecimalsAndBanglaDigits' --tests 'com.amarhisab.AccountingMathTest.calculatorRejectsIncompleteDivideByZeroAndOverflowExpressions' --tests 'com.amarhisab.AccountingMathTest.categoryIdsAreStableAndLegacyRecordsStayUnassigned' --tests 'com.amarhisab.AccountingMathTest.categorySearchIsStrictUnlessAllCategoriesIsExplicitlySelected' --tests 'com.amarhisab.AccountingMathTest.sameNamedAccountsRemainSeparateAcrossCategoriesAndIds' --tests 'com.amarhisab.AccountingMathTest.cashboxTransferReducesSourceAndIncreasesDestinationOnly' --tests 'com.amarhisab.AccountingMathTest.cashboxOpeningBalanceAndMovementsAreCheckedForOverflow' --tests 'com.amarhisab.AccountingMathTest.cashboxTransfersAreNotIncomeOrExpenseLabels' --tests 'com.amarhisab.AccountingMathTest.openingCashboxBalanceMustBeFiniteAndNonnegative' --tests 'com.amarhisab.AccountingMathTest.cashboxTransferRequiresDistinctAccountsAndSufficientFunds' --tests 'com.amarhisab.AttachmentGenerationStoreTest'

      - name: Publish accounting report summary
        if: always()
        shell: bash
        run: |
          echo '### accounting test group' >> "$GITHUB_STEP_SUMMARY"
          if [ -d app/build/test-results/testDebugUnitTest ]; then
            find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -maxdepth 1 -print
            grep -h '<testsuite' app/build/test-results/testDebugUnitTest/TEST-*.xml >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo 'No JUnit XML report was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi


  rental-stock-tests:
    name: Group 3 — Rental, deposits and shop stock
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run dedicated rental and stock unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest --tests 'com.amarhisab.AccountingMathTest.calculatesWeightedAveragePurchaseCost' --tests 'com.amarhisab.AccountingMathTest.calculatesCostOfGoodsSold' --tests 'com.amarhisab.AccountingMathTest.calculatesGrossProfit' --tests 'com.amarhisab.AccountingMathTest.vacantRentalUnitsAcceptBanglaAndEnglishLabels' --tests 'com.amarhisab.AccountingMathTest.stockCreditSaleCountsAsBothReceivableAndBusinessIncome' --tests 'com.amarhisab.AccountingMathTest.multiplePartialRentPaymentsReduceOnlyTheirOwnMonth' --tests 'com.amarhisab.AccountingMathTest.rentalPaymentTotalsIgnoreInvalidAmounts' --tests 'com.amarhisab.AccountingMathTest.stockCalculationsRejectInvalidAndOverflowValues' --tests 'com.amarhisab.AccountingMathTest.weightedAverageCostIncludesRepeatedPurchases' --tests 'com.amarhisab.AccountingMathTest.zeroStockHasZeroAverageCost' --tests 'com.amarhisab.AccountingMathTest.monthlyRentDuplicateMustMatchBuildingWhenUsingLegacyKey' --tests 'com.amarhisab.AccountingMathTest.rentalSetupRejectsInvalidAmountsAndDueDays' --tests 'com.amarhisab.AccountingMathTest.preventsDuplicateRentalUnitIdentity' --tests 'com.amarhisab.AccountingMathTest.validatesRentalEffectiveMonth' --tests 'com.amarhisab.AccountingMathTest.futureRentIncreaseDoesNotChangeCurrentMonthRent' --tests 'com.amarhisab.AccountingMathTest.backdatedRentChangeKeepsTheLatestEffectiveRentForCurrentMonth' --tests 'com.amarhisab.AccountingMathTest.depositRefundUsesTheTenantWhoOwnsTheDeposit' --tests 'com.amarhisab.AccountingMathTest.rentalExpensesMustMatchTheirBuildingAndUnit' --tests 'com.amarhisab.AccountingMathTest.rentalPaymentsMustMatchTenantUnitAndBuilding' --tests 'com.amarhisab.AccountingMathTest.rentalPaymentLinksRequireTheSameMonthTenantUnitAndBuilding' --tests 'com.amarhisab.AccountingMathTest.rentalPaymentsCannotCrossTenantUnitOrBuildingBoundaries' --tests 'com.amarhisab.AccountingMathTest.overpaymentInOneMonthCannotHideAnotherMonthsArrears' --tests 'com.amarhisab.AccountingMathTest.archivedTenantPaymentsCannotReduceNewTenantsClosingBalance' --tests 'com.amarhisab.AccountingMathTest.partialPaymentsAreCappedAtTheirOwnMonthlyDue' --tests 'com.amarhisab.AccountingMathTest.rentPostingIdentityIncludesMonthBuildingUnitAndTenant' --tests 'com.amarhisab.AccountingMathTest.rentalAndDepositRecordsStayOutOfPersonalPartyLedger' --tests 'com.amarhisab.AccountingMathTest.refundableDepositReceiptAndRefundAreNotBusinessIncome' --tests 'com.amarhisab.AccountingMathTest.ordinaryPersonalPartyTransactionsStayInPersonalPartyLedger'

      - name: Publish rental and stock report summary
        if: always()
        shell: bash
        run: |
          echo '### rental and stock test group' >> "$GITHUB_STEP_SUMMARY"
          if [ -d app/build/test-results/testDebugUnitTest ]; then
            find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -maxdepth 1 -print
            grep -h '<testsuite' app/build/test-results/testDebugUnitTest/TEST-*.xml >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo 'No JUnit XML report was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi


  emulator-install-launch:
    name: Install and launch APK on Android Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    steps:
      - name: Checkout source for emulator smoke test
        uses: actions/checkout@v4

      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: Amar-Hisab-Validated-APK
          path: dist

      - name: Normalize downloaded APK path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_PATH="$(find dist -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          if [ "$APK_PATH" != "dist/app-debug.apk" ]; then
            cp "$APK_PATH" dist/app-debug.apk
          fi
          test -s dist/app-debug.apk
          sha256sum dist/app-debug.apk

      - name: Boot emulator, install APK and verify launch
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$(dirname "$SDKMANAGER"):$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "Android SDK: $SDK_ROOT"
          echo "Android AVD directory: $ANDROID_AVD_HOME"
          echo "Android SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --install "system-images;android-28;google_apis;x86_64"
          echo "no" | avdmanager create avd --name amar-hisab-ci --package "system-images;android-28;google_apis;x86_64" --device "pixel_2" --force
          avdmanager list avd
          test -s "$ANDROID_AVD_HOME/amar-hisab-ci.ini"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device /dev/kvm is unavailable on this runner."
            exit 1
          fi
          emulator -avd amar-hisab-ci -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics -memory 4096 -cores 4 -wipe-data > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "===== Emulator diagnostic log ====="; tail -n 200 "$RUNNER_TEMP/emulator.log" || true; echo "===== Emulator process ====="; ps -ef | grep -E "[e]mulator|[q]emu" || true; fi; kill "$EMULATOR_PID" 2>/dev/null || true; exit "$status"' EXIT
          adb start-server
          if ! timeout 240s adb wait-for-device; then
            echo "ADB did not detect the emulator within 240 seconds."
            exit 1
          fi
          BOOTED=0
          for i in $(seq 1 90); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          if [[ "$BOOTED" != "1" ]]; then
            echo "Emulator did not finish booting within 180 seconds."
            tail -n 200 "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          bash .github/scripts/emulator-smoke-test.sh


  publish-release:
    name: Publish APK release and update latest.json
    runs-on: ubuntu-24.04
    needs: [build, accounting-tests, rental-stock-tests, emulator-install-launch]
    # Release only after an explicit opt-in: manual workflow_dispatch, or a specially marked commit.
    # Ordinary source pushes never publish or replace a release.
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]'))) && needs.build.result == 'success' && needs.accounting-tests.result == 'success' && needs.rental-stock-tests.result == 'success' && needs.emulator-install-launch.result == 'success'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: Amar-Hisab-Validated-APK
          path: dist

      - name: Prepare release metadata
        id: metadata
        env:
          VERSION_CODE: ${{ inputs.version_code || '111' }}
          VERSION_NAME: ${{ inputs.version_name || '2.1.1' }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Rebase before generating latest.json so the working tree is clean.
          git fetch origin main
          git rebase origin/main
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "version_code must be a positive integer" >&2
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "version_name must look like 2.0 or 2.0.1" >&2
            exit 1
          fi
          APK="dist/app-debug.apk"
          test -s "$APK"
          mv "$APK" dist/Amar-Hisab.apk
          SHA256="$(sha256sum dist/Amar-Hisab.apk | awk '{print $1}')"
          TAG="v$VERSION_NAME"
          APK_URL="https://github.com/$REPOSITORY/releases/download/$TAG/Amar-Hisab.apk"
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$APK_URL" "$SHA256" > latest.json <<'PY'
          import json, sys
          version_code, version_name, apk_url, sha256 = sys.argv[1:]
          print(json.dumps({
              "versionCode": int(version_code),
              "versionName": version_name,
              "apkUrl": apk_url,
              "sha256": sha256,
              "releaseNotes": "আমার হিসাবের নতুন সংস্করণ।"
          }, ensure_ascii=False, indent=2))
          PY
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          cat latest.json

      - name: Create GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION_NAME: ${{ inputs.version_name || '2.1.1' }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/Amar-Hisab.apk#Amar-Hisab.apk" --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" "dist/Amar-Hisab.apk#Amar-Hisab.apk" --repo "$REPOSITORY" --title "আমার হিসাব $VERSION_NAME" --notes "Installable Android APK; in-app download verifies SHA-256."
          fi

      - name: Commit latest.json for in-app updates
        env:
          VERSION_NAME: ${{ inputs.version_name || '2.1.1' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish in-app update metadata $VERSION_NAME"
          git push origin HEAD:main
