name: Publish Amar Hisab APK release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest signed APK
        run: |
          curl --fail --location 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-cf84-8211-8a9f-db434c566597/raw?se=2026-11-16T07%3A33%3A34Z&sp=r&sv=2026-06-06&sr=b&scid=55cd052c-b840-5e30-aa97-67ccd77e37ea&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-15T23%3A47%3A33Z&ske=2026-11-16T23%3A47%3A33Z&sks=b&skv=2026-06-06&sig=phxW0BINPXbN0AqcQ8Zle0H%2Buvm5tGio596Fop5KjD0%3D' --output artifact.zip
          unzip -j artifact.zip app-release.apk -d release
          test -s release/app-release.apk
      - name: Publish Amar Hisab 1.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256=$(sha256sum release/app-release.apk | cut -d ' ' -f 1)
          gh release create v1.6 release/app-release.apk --repo "${GITHUB_REPOSITORY}" --title "Amar Hisab 1.6" --notes "Updated build with installer and update verification fixes."
          printf '{"versionCode":7,"versionName":"1.6","apkUrl":"https://github.com/mahabuburrahaman402-hue/-Amar-hisab/releases/download/v1.6/app-release.apk","sha256":"%s","releaseNotes":"আপডেট যাচাই ও ইনস্টল প্রক্রিয়া সংশোধনসহ নতুন সংস্করণ।"}\n' "$sha256" > latest.json
          old_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/latest.json" --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/contents/latest.json" -X PUT -f message="Update Amar Hisab 1.6 manifest" -f sha="$old_sha" -f content="$(base64 -w0 latest.json)"
