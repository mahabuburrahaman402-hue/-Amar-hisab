name: Publish Amar Hisab APK release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK artifact
        run: |
          curl --fail --location 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-8468-8211-98fd-eff68062a2c8/raw?se=2026-11-16T07%3A11%3A50Z&sp=r&sv=2026-06-06&sr=b&scid=55d5750a-83a4-5b83-946a-3fa53f8f8dd2&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-16T03%3A36%3A27Z&ske=2026-11-17T03%3A36%3A27Z&sks=b&skv=2026-06-06&sig=kk98fPAwvEtqt1HAt6dFCp1tocJOwhtuH7W6aGm66TA%3D' --output artifact.zip
          unzip -j artifact.zip app-release.apk -d release
          test -s release/app-release.apk
      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5 release/app-release.apk --repo "${GITHUB_REPOSITORY}" --title "Amar Hisab 1.5" --notes "In-app update checker, verified APK download, and installer flow."
